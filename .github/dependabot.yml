version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "mike-boddin"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vuetify"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      # vue-tsc does not support TypeScript 7 (no typescript/lib/tsc export)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 3.x needs brace-expansion 3.x (default import), which conflicts with the
      # brace-expansion ^5 override and is flagged by npm audit
      - dependency-name: "vite-plugin-vue-layouts-next"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(npm):"
    groups:
      vue-stack:
        patterns:
          - "vue*"
          - "vuetify*"
      build-tools:
        patterns:
          - "@vitejs/*"
          - "vite"
          - "eslint*"
          - "typescript*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    assignees:
      - "mike-boddin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo):"
    ignore:
      - dependency-name: "tauri"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "mike-boddin"
    commit-message:
      prefix: "deps(actions):"